name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Create .env for build
        run: |
          cat > .env << 'EOF'
          AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_BASE_URL=
          NEXT_PUBLIC_API_PATH=/api
          DATABASE_URL=postgresql://postgres:postgres123@localhost:5432/xinglukeblog
          EOF

      - name: Generate Prisma client
        run: pnpm dbg

      - name: Build Next.js
        run: pnpm build

      - name: Prepare deployment package
        run: |
          tar czf deploy.tar.gz \
            .next/standalone .next/static .next/BUILD_ID \
            .next/app-build-manifest.json .next/app-path-routes-manifest.json .next/build-manifest.json \
            .next/export-marker.json .next/images-manifest.json .next/next-minimal-server.js.nft.json \
            .next/next-server.js.nft.json .next/package.json .next/prerender-manifest.json \
            .next/react-loadable-manifest.json .next/required-server-files.json .next/routes-manifest.json \
            public package.json src/database

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: deploy.tar.gz
          target: /tmp/
          strip_components: 0

      - name: Restart app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            bash /opt/xinglukeblog/deploy.sh
