name: Syndate Android Build

permissions:
  contents: write

on:
  push:
    branches: [synDate]
    paths:
      - 'syndate/android/**'
      - 'syndate/shared/**'
    tags:
      - 'syndate-android-v*'
  workflow_dispatch:

concurrency:
  group: syndate-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: syndate/android
        run: |
          npm install
          npx expo install --fix

      - name: Prebuild android project
        working-directory: syndate/android
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: syndate/android/android
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syndate-android-apk
          path: syndate/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/syndate-android-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: syndate-android-apk
          path: /tmp/apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SynData Android ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            SynData 安卓端 APK

            安装方式：下载 `app-debug.apk` 后传到手机安装（需允许未知来源）。
          files: /tmp/apk/**/*
          draft: false
          prerelease: false
