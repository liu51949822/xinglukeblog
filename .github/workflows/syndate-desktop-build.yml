name: Syndate Desktop Build

permissions:
  contents: write

on:
  push:
    branches: [synDate]
    paths:
      - 'syndate/desktop/**'
      - 'syndate/shared/**'
    tags:
      - 'syndate-desktop-v*'
  workflow_dispatch:

concurrency:
  group: syndate-desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: syndate/desktop
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm install

      - name: Build Electron app
        working-directory: syndate/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syndate-desktop-${{ matrix.os }}
          path: |
            syndate/desktop/dist/**/*
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/syndate-desktop-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: syndate-desktop-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SynData Desktop ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            SynData 桌面端安装包

            - Windows: `*.exe`（NSIS 安装包）
            - macOS: `*.dmg`
            - Linux: `*.AppImage`
          files: /tmp/artifacts/**/*
          draft: false
          prerelease: false
