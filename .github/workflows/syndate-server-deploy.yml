name: Syndate Server Deploy

on:
  push:
    branches: [synDate]
    paths:
      - 'syndate/server/**'
  workflow_dispatch:

concurrency:
  group: syndate-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: syndate/server
        run: npm install --omit=dev

      - name: Create deployment archive
        working-directory: syndate/server
        run: |
          mkdir -p ../../deploy_tmp
          tar czf ../../deploy_tmp/syndate-server.tar.gz \
            --exclude=node_modules \
            package.json src/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: deploy_tmp/syndate-server.tar.gz
          target: /opt/syndate/

      - name: Restart service on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            # 解压上传的代码（scp 目标保留 deploy_tmp 目录）
            cd /opt/syndate
            mkdir -p server
            tar xzf /opt/syndate/deploy_tmp/syndate-server.tar.gz -C server
            rm -rf /opt/syndate/deploy_tmp

            # 停止旧容器
            docker rm -f syndate 2>/dev/null || true

            # 启动新容器（代码挂载进容器，容器内装依赖并启动）
            docker run -d --name syndate \
              -p 8787:8787 \
              --restart unless-stopped \
              -v /opt/syndate/server:/app \
              -w /app \
              -e PORT=8787 \
              node:22-alpine \
              /bin/sh -c 'npm install --omit=dev --silent && node src/index.js'

            sleep 8
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8787/api/health || echo 000)
            echo "Health: $CODE"
            if [ "$CODE" != "200" ]; then
              echo "=== container logs ==="
              docker logs syndate --tail 20
              exit 1
            fi
