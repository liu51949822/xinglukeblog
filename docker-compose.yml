services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xinglukeblog
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@host.docker.internal:${DB_PORT:-15432}/${DB_NAME:-xinglukeblog}?schema=public
      - DIRECT_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@host.docker.internal:${DB_PORT:-15432}/${DB_NAME:-xinglukeblog}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-16379}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    networks:
      - xinglukeblog-network
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/test/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xinglukeblog-network:
    driver: bridge
